[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-local-vault"
version = "0.1.0"
description = "A small encrypted local vault for human-in-the-loop agent workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "RobbyMo81" }
]
keywords = ["vault", "secrets", "hitl", "agents", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Utilities",
]
dependencies = [
  "cryptography>=42",
]

[project.scripts]
hitl-vault = "hitl_vault:main"

[tool.setuptools]
py-modules = ["hitl_vault"]
